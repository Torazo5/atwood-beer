<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173226" />
    <title>Atwood — Beer Counter</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap");

      :root { color-scheme: dark; font-family: "DM Mono", monospace; background: #173226; color: #f5edda; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: #173226; }
      main { width: min(100% - 40px, 640px); text-align: center; }
      .mark { width: 78px; margin: 0 auto 9px; color: #d59a39; }
      .mark svg { display: block; width: 100%; height: auto; }
      h1 { margin: 0 0 42px; color: #f5edda; font: normal clamp(28px, 8vw, 44px)/1 "DM Serif Display", Georgia, serif; letter-spacing: -.04em; white-space: nowrap; }
      .counter { border-top: 1px solid #9d723d; border-bottom: 1px solid #9d723d; padding: 44px 12px 48px; }
      output { display: block; font: normal clamp(82px, 30vw, 215px)/.8 "DM Serif Display", Georgia, serif; letter-spacing: -.075em; color: #d59a39; text-shadow: 0 4px 0 #765127; }
      button { font: 500 12px "DM Mono", monospace; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
      #open { margin-top: 39px; padding: 15px 21px; border: 1px solid #d59a39; border-radius: 3px; color: #173226; background: #d59a39; transition: transform .15s, background .15s; }
      #open:hover, #open:focus-visible { transform: translateY(-2px); background: #f0bd62; }
      dialog { width: min(calc(100% - 40px), 370px); padding: 0; color: #f5edda; border: 1px solid #9d723d; border-radius: 5px; background: #244231; box-shadow: 0 24px 80px #000; }
      dialog::backdrop { background: rgb(0 0 0 / .65); backdrop-filter: blur(3px); }
      form { padding: 28px; text-align: left; }
      h2 { margin: 0 0 25px; font: normal 32px/1 "DM Serif Display", Georgia, serif; }
      label { display: block; margin: 16px 0 7px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #d5bb86; }
      input { width: 100%; padding: 12px; color: #f5edda; border: 1px solid #6b7753; border-radius: 2px; background: #173226; font: 16px "DM Mono", monospace; }
      input:focus { outline: 2px solid #d59a39; outline-offset: 2px; }
      .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 27px; }
      .actions button { padding: 11px 13px; border: 1px solid #6b7753; border-radius: 2px; color: #f5edda; background: transparent; }
      .actions button[type="submit"] { border-color: #d59a39; color: #173226; background: #d59a39; }
      #error { min-height: 15px; margin: 13px 0 0; color: #ff9c83; font-size: 11px; }
      #beer-splash { position: fixed; z-index: 2; inset: 0; display: grid; place-items: center; font-size: clamp(52px, 14vw, 104px); letter-spacing: -.28em; opacity: 0; pointer-events: none; filter: drop-shadow(0 8px 0 #765127); }
      #beer-splash.pop { animation: beer-splash .9s cubic-bezier(.2, .8, .25, 1) both; }
      @keyframes beer-splash { 0% { opacity: 0; transform: scale(.25) rotate(-12deg); } 18% { opacity: 1; transform: scale(1.12) rotate(6deg); } 42% { transform: scale(.94) rotate(-3deg); } 75% { opacity: 1; transform: translateY(-18px) scale(1); } 100% { opacity: 0; transform: translateY(-70px) scale(1.08); } }
      #beer-flight { position: fixed; z-index: 2; inset: 0; overflow: hidden; pointer-events: none; }
      .beer-fly { position: absolute; bottom: -52px; left: 50%; font-size: clamp(28px, 7vw, 52px); animation: beer-flight 2.2s cubic-bezier(.16, .7, .38, 1) var(--delay) both; filter: drop-shadow(0 4px 0 #765127); }
      @keyframes beer-flight { 0% { opacity: 0; transform: translate(-50%, 0) rotate(0) scale(.65); } 12% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-100svh - 35px)) rotate(var(--spin)) scale(1); } }
      @media (prefers-reduced-motion: reduce) { #beer-splash.pop, .beer-fly { animation: none; } }
      @media (max-width: 480px) {
        main { width: calc(100% - 28px); }
        .mark { width: 62px; }
        h1 { margin-bottom: 28px; }
        .counter { padding: 32px 4px 36px; }
        #open { margin-top: 28px; }
        form { padding: 24px; }
      }
    </style>
  </head>
  <body>
    <div id="beer-splash" aria-hidden="true">🍺🍻🍺</div>
    <div id="beer-flight" aria-hidden="true"></div>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 78 50" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter" stroke-width="2">
          <path d="M12 43V25m0-18 9 18H3L12 7Zm27 36V17m0-12 12 21H27L39 5Zm27 38V27m0-17 10 17H56L66 10Z" />
          <path d="M3 44h72" />
        </svg>
      </div>
      <h1>atwood beer counter</h1>
      <section class="counter" aria-label="Beer counter">
        <output id="count" aria-live="polite">0</output>
      </section>
      <button id="open" type="button">Add some beers</button>
    </main>

    <dialog id="add-dialog" aria-labelledby="dialog-title">
      <form id="add-form" method="dialog">
        <h2 id="dialog-title">Add to the tally</h2>
        <label for="amount">How many?</label>
        <input id="amount" name="amount" type="number" min="1" step="1" inputmode="numeric" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="off" required />
        <p id="error" role="alert"></p>
        <div class="actions">
          <button id="cancel" type="button">Never mind</button>
          <button type="submit">Add</button>
        </div>
      </form>
    </dialog>

    <script type="module">
      import { CountUp } from "countup.js";

      const count = document.querySelector("#count");
      const dialog = document.querySelector("#add-dialog");
      const form = document.querySelector("#add-form");
      const amount = document.querySelector("#amount");
      const password = document.querySelector("#password");
      const error = document.querySelector("#error");
      const beerSplash = document.querySelector("#beer-splash");
      const beerFlight = document.querySelector("#beer-flight");
      const storageKey = "atwood-beer-count";
      const celebration = "flight";

      const savedCount = Number(localStorage.getItem(storageKey));
      let beers = Number.isSafeInteger(savedCount) && savedCount >= 0 ? savedCount : 0;

      function showBeerSplash() {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        beerSplash.classList.remove("pop");
        void beerSplash.offsetWidth;
        beerSplash.classList.add("pop");
      }

      function showBeerFlight(added) {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const visibleBeers = Math.min(added, 12);
        beerFlight.replaceChildren();
        for (let index = 0; index < visibleBeers; index += 1) {
          const beer = document.createElement("span");
          beer.className = "beer-fly";
          beer.textContent = index % 3 === 1 ? "🍻" : "🍺";
          beer.style.setProperty("--delay", `${index * .055}s`);
          beer.style.setProperty("--x", `${(index - (visibleBeers - 1) / 2) * 34}px`);
          beer.style.setProperty("--spin", `${(index % 2 ? 1 : -1) * (200 + index * 21)}deg`);
          beerFlight.append(beer);
        }
        beerFlight.lastElementChild.addEventListener("animationend", () => beerFlight.replaceChildren(), { once: true });
      }

      function animateCount(total) {
        if (total === 0 || matchMedia("(prefers-reduced-motion: reduce)").matches) {
          count.textContent = total;
          return;
        }

        const counter = new CountUp(count, total, { startVal: 0, duration: 1.5 });
        if (counter.error) {
          count.textContent = total;
          return;
        }
        count.setAttribute("aria-live", "off");
        counter.start(() => count.setAttribute("aria-live", "polite"));
      }

      animateCount(beers);

      document.querySelector("#open").addEventListener("click", () => {
        form.reset();
        error.textContent = "";
        dialog.showModal();
        amount.focus();
      });
      document.querySelector("#cancel").addEventListener("click", () => dialog.close());
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const added = Number(amount.value);
        if (password.value !== "beer") {
          error.textContent = "That password isn't it.";
          password.select();
          return;
        }
        if (!Number.isSafeInteger(added) || added < 1 || beers > Number.MAX_SAFE_INTEGER - added) {
          error.textContent = "Pick a whole number that fits the tally.";
          amount.focus();
          return;
        }
        beers += added;
        localStorage.setItem(storageKey, beers);
        count.textContent = beers;
        dialog.close();
        if (celebration === "splash") showBeerSplash();
        else showBeerFlight(added);
      });
    </script>
  </body>
</html>
